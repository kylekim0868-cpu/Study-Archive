name: Create learning sub-issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  create-subissues:
    if: startsWith(github.event.issue.title, '[Algorithm]')
    runs-on: ubuntu-latest

    steps:
      - name: Create and connect learning sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const parentIssueNumber = context.issue.number;

            const subIssueTitles = [
              '개념 공부 및 문제 분석',
              '1차 코드 작성 (Self Solved)',
              '코드 최적화 및 복습 정리'
            ];

            for (const title of subIssueTitles) {

              // 1. 일반 Issue 생성
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title
              });

              const childIssue = createdIssue.data;

              console.log(
                `Created issue #${childIssue.number}: ${title}`
              );

              // 2. 방금 만든 Issue를 부모 Issue의 Sub-issue로 연결
              await github.request(
                'POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                {
                  owner,
                  repo,
                  issue_number: parentIssueNumber,
                  sub_issue_id: childIssue.id,
                  headers: {
                    'X-GitHub-Api-Version': '2026-03-10'
                  }
                }
              );

              console.log(
                `Linked #${childIssue.number} to parent #${parentIssueNumber}`
              );
            }
